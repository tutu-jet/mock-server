<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>多设备流量页 · 交互预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#203247;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;gap:26px;padding:16px 28px;background:white;border-bottom:1px solid #dce3eb}header b{font-size:17px}.nav{color:#0070f2;font-weight:600}.preview{margin-left:auto;color:#63778b;font-size:12px}main{max-width:1440px;margin:auto;padding:26px 28px}h1{font-size:21px;margin:0 0 4px}p{margin:0;color:#63778b}.devices{display:flex;gap:12px;overflow:auto;padding:20px 0}.device{flex:0 0 215px;text-align:left;border:1px solid #dce3eb;border-radius:9px;background:white;padding:13px 16px;color:#203247}.device[aria-pressed="true"]{background:#eef5ff;border:2px solid #0070f2;padding:12px 15px}.device strong{display:block;font-size:15px}.device small{display:block;color:#63778b;margin-top:5px}.scope{display:flex;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid #dce3eb;padding:0 0 20px}.scope>p{margin-left:auto;font-size:12px}.btn{background:white;color:#203247;border:1px solid #dce3eb;border-radius:6px;padding:7px 12px}.danger{color:#b32635}.rule-note{background:#edf3fa;border-radius:6px;padding:10px 14px;color:#526c87;font-size:13px;margin:18px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th{text-align:left;font-weight:500;color:#63778b;font-size:12px}th,td{padding:13px 12px;border-bottom:1px solid #e4e9ef}td{font-size:13px;overflow-wrap:anywhere}tbody tr:hover{background:#f2f7fd}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.hit{color:#267448}.muted{color:#63778b}.empty{text-align:center;padding:60px 20px;background:white;color:#63778b}.retention{font-size:12px;margin-top:16px}dialog{border:1px solid #dce3eb;border-radius:12px;padding:24px;width:min(540px,92vw);color:#203247;box-shadow:0 16px 80px #10203030}dialog::backdrop{background:#14263b50}dialog h2{font-size:18px;margin:0 0 18px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}label{display:block;margin:12px 0 4px}input,select{width:100%;padding:8px;border:1px solid #b9c7d7;border-radius:5px}.live{color:#267448}.hidden{display:none}button:focus-visible{outline:2px solid #0070f2;outline-offset:3px}.detail{border:0;background:none;color:#0070f2}
@media(max-width:760px){header{padding:12px 16px;gap:16px}main{padding:20px 16px}.device{flex-basis:190px}.scope>p{margin:0;width:100%}th:first-child,td:first-child{display:none}.preview{font-size:10px}}
</style>
<header><b>mock-server</b><span class="nav">流量</span><div class="preview">交互预览 · 示例数据</div></header>
<main><h1>设备流量</h1><p>设备通过代理发起请求后自动出现。选择设备查看对应流量。</p>
<div class="devices" id="devices" aria-label="选择设备"></div>
<div class="scope"><span class="live">● 实时接收</span><b id="scope-title"></b><span id="counts" class="muted"></span><p>Mock 规则对全部设备生效</p><button class="btn" id="manage">设备管理</button><button class="btn danger" id="clear">清空全部流量</button></div>
<div class="rule-note">设备筛选只改变查看范围。规则与整体 Mock 开关仍由所有设备共用。忽略 Host 沿用全局设置。</div>
<div class="table-wrap"><table id="table"><thead><tr><th>时间</th><th class="source">设备</th><th>方法 / 状态</th><th>请求地址</th><th>耗时</th><th>规则 / 操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" class="empty hidden">此范围暂无流量。可切换“全部设备”，或在设备上发起请求。</div>
<p class="retention">建议保留范围：每设备最多 1,000 条，总计最多 5,000 条。连接状态仅表示代理观察到的通信情况。</p></main>
<dialog id="manage-dialog"><h2>设备管理</h2><p>同一来源 IP 的多个连接归为一台设备。平台无法识别时标记为未知。</p><label for="edit-device">选择设备</label><select id="edit-device"></select><label for="device-alias">设备名称</label><input id="device-alias" maxlength="40"><label for="device-platform">平台</label><select id="device-platform"><option>Android</option><option>iOS</option><option>其他</option><option>未知</option></select><p id="device-summary"></p><div class="actions"><button class="btn" data-close="manage-dialog">取消</button><button class="btn" id="save-device">保存</button></div></dialog>
<dialog id="clear-dialog"><h2 id="clear-title"></h2><p id="clear-note"></p><div class="actions"><button class="btn" data-close="clear-dialog">取消</button><button class="btn danger" id="confirm-clear">清空</button></div></dialog>
<dialog id="detail-dialog"><h2>流量详情</h2><p id="detail-device"></p><p id="detail-content"></p><div class="actions"><button class="btn" data-close="detail-dialog">关闭</button></div></dialog>
<script>
const devices=[{id:'android',name:'Android 测试机',platform:'Android',ip:'192.0.2.10',state:'正在通信'},{id:'ios',name:'iPhone 测试机',platform:'iOS',ip:'192.0.2.11',state:'正在通信'},{id:'other',name:'备用测试机',platform:'未知',ip:'192.0.2.12',state:'暂无连接'}];
let records=[{device:'ios',time:'14:32:18',method:'GET',status:403,path:'/odata/mobile/CaseListItem',ms:4,rule:'无权限'},{device:'android',time:'14:32:17',method:'GET',status:403,path:'/odata/mobile/CaseListItem',ms:5,rule:'无权限'},{device:'ios',time:'14:32:16',method:'GET',status:200,path:'/odata/mobile/CalendarSettings',ms:89,rule:''},{device:'android',time:'14:32:15',method:'GET',status:200,path:'/odata/calendar/TimelineEvents',ms:3,rule:'无数据'},{device:'other',time:'14:30:02',method:'GET',status:200,path:'/odata/mobile/EventType',ms:102,rule:''}];
let selected='all';const el=id=>document.getElementById(id),device=id=>devices.find(d=>d.id===id);
function button(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b}
function render(){
el('devices').replaceChildren();
for(const d of [{id:'all',name:'全部设备',ip:'3 台已发现 · 2 台正在通信'},...devices]){const b=button('',()=>{selected=d.id;render()});b.className='device';b.setAttribute('aria-pressed',String(selected===d.id));const title=document.createElement('strong');title.textContent=d.name;b.append(title);const info=document.createElement('small');info.textContent=d.id==='all'?d.ip:d.platform+' · '+d.ip;b.append(info);if(d.state){const state=document.createElement('small');state.textContent=d.state;b.append(state)}el('devices').append(b)}
const visible=records.filter(r=>selected==='all'||r.device===selected);el('scope-title').textContent=selected==='all'?'全部设备':device(selected).name;el('counts').textContent='当前保留 '+visible.length+' 条 · 命中 '+visible.filter(r=>r.rule).length;el('clear').textContent=selected==='all'?'清空全部流量':'清空此设备流量';el('rows').replaceChildren();el('table').classList.toggle('hidden',!visible.length);el('empty').classList.toggle('hidden',!!visible.length);document.querySelector('th.source').classList.toggle('hidden',selected!=='all');
for(const r of visible){const d=device(r.device),tr=document.createElement('tr');[r.time,d.name+' · '+d.ip,r.method+' / '+r.status,r.path,r.ms+'ms',r.rule?'Mock · '+r.rule:'透传'].forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index===1&&selected!=='all')td.className='hidden';if(index===3)td.className='mono';if(index===5){if(r.rule)td.className='hit';td.append(button('详情',()=>{el('detail-device').textContent=d.name+' · '+d.platform+' · '+d.ip+':53124';el('detail-content').textContent=r.method+' '+r.path+' · 状态 '+r.status+' · '+r.ms+'ms';el('detail-dialog').showModal()}));td.lastChild.className='detail'}tr.append(td)});el('rows').append(tr)}
}
function loadDevice(){const d=device(el('edit-device').value);el('device-alias').value=d.name;el('device-platform').value=d.platform;el('device-summary').textContent=d.ip+' · '+d.state}
el('manage').onclick=()=>{el('edit-device').replaceChildren();devices.forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.name+' · '+d.ip;el('edit-device').append(o)});el('edit-device').value=selected==='all'?devices[0].id:selected;loadDevice();el('manage-dialog').showModal()};el('edit-device').onchange=loadDevice;
el('save-device').onclick=()=>{const d=device(el('edit-device').value);d.name=el('device-alias').value.trim()||'设备 · '+d.ip;d.platform=el('device-platform').value;el('manage-dialog').close();render()};
el('clear').onclick=()=>{el('clear-title').textContent=selected==='all'?'清空全部设备流量？':'清空“'+device(selected).name+'”的流量？';el('clear-note').textContent=selected==='all'?'删除所有设备已记录的流量与原始响应体。设备连接和 Mock 规则保持当前状态。':'仅删除此设备的流量与原始响应体。其他设备的记录、设备连接和 Mock 规则保持当前状态。';el('clear-dialog').showModal()};el('confirm-clear').onclick=()=>{records=selected==='all'?[]:records.filter(r=>r.device!==selected);el('clear-dialog').close();render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());render();
</script>
</html>
