<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}mock-server{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230070f2'/><stop offset='1' stop-color='%230064d9'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif' font-size='40' font-weight='700' fill='white'>M</text></svg>">
<link rel="stylesheet" href="/static/app.css?v={{ STATIC_VERSION }}">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="brand-title">mock-server</div>
      <div class="brand-sub">代理 9077 · UI 9088</div>
    </div>
  </div>
  <nav>
    <a href="/rules" class="nav-item {% if active_tab=='rules' %}active{% endif %}">规则</a>
    <a href="/flows" class="nav-item {% if active_tab=='flows' %}active{% endif %}">流量</a>
    <a href="/help" class="nav-item {% if active_tab=='help' %}active{% endif %}">帮助</a>
  </nav>
</aside>

<main class="main">
  <header class="page-header">
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="subtitle">{% block subtitle %}{% endblock %}</p>
  </header>
  {% block content %}{% endblock %}
</main>

<div id="toast-container" class="toast-container"></div>
<div id="drawer-root"></div>
<div id="confirm-root"></div>

<script>
// 全局 toast：监听 HX-Trigger 中的 toast 事件
document.body.addEventListener("toast", e => {
  const {kind = "info", msg} = e.detail;
  const el = document.createElement("div");
  el.className = `toast toast-${kind}`;
  el.textContent = msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3000);
});

// 抽屉关闭：在遮罩空白处按下（且不是拖拽把手）就收起。
// 用 pointerdown 起点判断，避免「从抽屉内选中文字拖到遮罩松手」被误判为点击而关闭。
document.body.addEventListener("pointerdown", e => {
  if (e.target.classList.contains("drawer-overlay")) {
    document.getElementById("drawer-root").innerHTML = "";
  }
});
// ESC 关抽屉
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("drawer-root").innerHTML = "";
});

// 抽屉宽度：可左右拖拽调整，持久化到 localStorage，下次打开沿用
(function() {
  const KEY = "mock-server.drawer-width";
  const MIN = 360;
  const root = document.documentElement;

  function maxWidth() { return Math.round(window.innerWidth * 0.95); }
  function clamp(w) { return Math.max(MIN, Math.min(maxWidth(), w)); }

  // 页面加载即套用上次宽度（新注入的抽屉通过 --drawer-width 变量自动生效）
  const saved = parseInt(localStorage.getItem(KEY), 10);
  if (saved) root.style.setProperty("--drawer-width", clamp(saved) + "px");

  function attachResizer(drawer) {
    if (drawer.querySelector(":scope > .drawer-resizer")) return;  // 已挂过
    const handle = document.createElement("div");
    handle.className = "drawer-resizer";
    handle.title = "拖动调整宽度";
    drawer.prepend(handle);

    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      handle.classList.add("active");
      document.body.classList.add("drawer-resizing");

      const move = ev => {
        // 抽屉贴右边：宽度 = 视口右缘到指针的距离
        const w = clamp(window.innerWidth - ev.clientX);
        root.style.setProperty("--drawer-width", w + "px");
      };
      const up = () => {
        handle.classList.remove("active");
        document.body.classList.remove("drawer-resizing");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        const cur = getComputedStyle(root).getPropertyValue("--drawer-width").trim();
        const n = parseInt(cur, 10);
        if (n) localStorage.setItem(KEY, String(n));
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
  }

  // 抽屉由 htmx 动态注入 drawer-root，监听其变化给每个 .drawer 挂把手
  const target = document.getElementById("drawer-root");
  new MutationObserver(() => {
    const d = target.querySelector(".drawer");
    if (d) attachResizer(d);
  }).observe(target, { childList: true, subtree: true });
})();

// 自定义 confirm modal：拦截 hx-confirm
(function() {
  const root = document.getElementById("confirm-root");

  function close() { root.innerHTML = ""; }

  function open({title, message, kind, okText, cancelText, onOk}) {
    const danger = kind === "danger";
    const overlay = document.createElement("div");
    overlay.className = "confirm-overlay";
    overlay.innerHTML = `
      <div class="confirm-modal ${danger ? 'danger' : ''}" role="dialog" aria-modal="true">
        <h3 class="confirm-title"><span class="confirm-dot"></span><span class="confirm-title-text"></span></h3>
        <p class="confirm-body"></p>
        <div class="confirm-foot">
          <button type="button" class="btn btn-ghost confirm-cancel"></button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'} confirm-ok"></button>
        </div>
      </div>`;
    overlay.querySelector(".confirm-title-text").textContent = title;
    overlay.querySelector(".confirm-body").textContent = message;
    overlay.querySelector(".confirm-cancel").textContent = cancelText || "取消";
    overlay.querySelector(".confirm-ok").textContent = okText || "确认";

    overlay.addEventListener("click", e => {
      if (e.target === overlay) close();
    });
    overlay.querySelector(".confirm-cancel").addEventListener("click", close);
    overlay.querySelector(".confirm-ok").addEventListener("click", () => {
      close();
      onOk && onOk();
    });

    root.appendChild(overlay);
    setTimeout(() => overlay.querySelector(".confirm-ok").focus(), 0);

    const escHandler = (e) => {
      if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler, true); }
      if (e.key === "Enter")  {
        const ok = overlay.querySelector(".confirm-ok");
        if (ok) ok.click();
        document.removeEventListener("keydown", escHandler, true);
      }
    };
    document.addEventListener("keydown", escHandler, true);
  }

  document.body.addEventListener("htmx:confirm", function(e) {
    if (!e.detail.question) return;  // 没设 hx-confirm 不拦
    e.preventDefault();
    const el = e.detail.elt;
    const kind = (el && el.dataset.confirmKind) || "default";
    const title = (el && el.dataset.confirmTitle) || (kind === "danger" ? "危险操作" : "确认");
    const okText = (el && el.dataset.confirmOk) || (kind === "danger" ? "删除" : "确认");
    const cancelText = (el && el.dataset.confirmCancel) || "取消";
    open({
      title, message: e.detail.question, kind, okText, cancelText,
      onOk: () => e.detail.issueRequest(true),
    });
  });

  // 暴露给非 HTMX 场景使用
  window.appConfirm = open;
})();

// 复制流量原始 body
async function copyFlowBody(flowId, kind, btn) {
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "...";
  try {
    const resp = await fetch(`/flows/${flowId}/body/${kind}?inline=1`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    await navigator.clipboard.writeText(text);
    btn.textContent = "已复制";
    document.body.dispatchEvent(new CustomEvent("toast", {detail: {kind: "info", msg: `已复制 ${text.length} 字符`}}));
  } catch (e) {
    btn.textContent = "失败";
    document.body.dispatchEvent(new CustomEvent("toast", {detail: {kind: "error", msg: `复制失败: ${e.message}`}}));
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 1500);
  }
}

// 拉取流量完整 body 并填入规则表单的 textarea（从流量保存为规则 - 截断场景）
async function copyFlowBodyToTextarea(flowId, kind, btn) {
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "...";
  try {
    const resp = await fetch(`/flows/${flowId}/body/${kind}?inline=1`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const ta = document.getElementById("rule-form-body");
    if (!ta) throw new Error("未找到 textarea");
    ta.value = text;
    btn.textContent = "已填入";
    document.body.dispatchEvent(new CustomEvent("toast", {detail: {kind: "success", msg: `已填入完整 body（${text.length} 字符）`}}));
  } catch (e) {
    btn.textContent = "失败";
    document.body.dispatchEvent(new CustomEvent("toast", {detail: {kind: "error", msg: `填入失败: ${e.message}`}}));
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 1500);
  }
}

// URL chip 与规则说明共用点击浮层，事件委托兼容局部更新。
(function() {
  let pop = null;
  let activeChip = null;

  function ensurePop() {
    if (pop) return pop;
    pop = document.createElement("div");
    pop.className = "url-popover";
    pop.id = "url-rule-popover";
    pop.innerHTML = `
      <div class="url-popover-head">
        <span class="url-popover-label"></span>
        <button type="button" class="url-popover-copy">复制</button>
      </div>
      <div class="url-popover-value"></div>
    `;
    document.body.appendChild(pop);
    pop.addEventListener("click", e => e.stopPropagation());
    pop.querySelector(".url-popover-copy").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      const val = pop.querySelector(".url-popover-value").textContent;
      const orig = btn.textContent;
      try {
        await navigator.clipboard.writeText(val);
        btn.textContent = "已复制";
      } catch {
        btn.textContent = "失败";
      }
      setTimeout(() => { btn.textContent = orig; }, 1200);
    });
    return pop;
  }

  function closePop() {
    if (!pop) return;
    pop.classList.remove("show");
    if (activeChip) {
      activeChip.classList.remove("active");
      if (activeChip.matches(".rule-tip")) {
        activeChip.setAttribute("aria-expanded", "false");
        activeChip.removeAttribute("aria-describedby");
      }
      activeChip = null;
    }
  }

  function openPop(chip) {
    if (activeChip && activeChip !== chip) closePop();
    const p = ensurePop();
    const isTip = chip.matches(".rule-tip");
    p.classList.toggle("rule-tooltip", isTip);
    p.querySelector(".url-popover-copy").hidden = isTip;
    if (isTip) {
      p.setAttribute("role", "tooltip");
      chip.setAttribute("aria-expanded", "true");
      chip.setAttribute("aria-describedby", p.id);
    } else {
      p.removeAttribute("role");
    }
    p.querySelector(".url-popover-label").textContent = chip.dataset.popoverLabel || "";
    p.querySelector(".url-popover-value").textContent = chip.dataset.popoverValue || "";
    p.classList.add("show");
    // 定位：chip 左下方，溢出右边时贴右边
    const r = chip.getBoundingClientRect();
    p.style.top = "0px";
    p.style.left = "0px";
    p.style.right = "auto";
    const pr = p.getBoundingClientRect();
    let left = r.left;
    if (left + pr.width > window.innerWidth - 12) {
      left = window.innerWidth - pr.width - 12;
    }
    if (left < 12) left = 12;
    p.style.left = left + "px";
    const top = r.bottom + 4 + pr.height > window.innerHeight - 12
      ? Math.max(12, r.top - pr.height - 4) : r.bottom + 4;
    p.style.top = top + "px";
    if (activeChip) activeChip.classList.remove("active");
    activeChip = chip;
    chip.classList.add("active");
  }

  document.addEventListener("click", e => {
    const chip = e.target.closest(".flow-chip, .rule-tip");
    if (chip) {
      e.preventDefault();
      e.stopPropagation();
      if (activeChip === chip) { closePop(); }
      else { openPop(chip); }
      return;
    }
    if (pop && pop.contains(e.target)) return;
    if (pop && pop.classList.contains("show")) closePop();
  }, true);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closePop();
  });
  window.addEventListener("scroll", () => {
    if (activeChip && activeChip.matches(".rule-tip") && document.activeElement === activeChip) {
      openPop(activeChip);
    } else {
      closePop();
    }
  }, true);
  window.addEventListener("resize", closePop);
  document.body.addEventListener("htmx:beforeSwap", closePop);
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
